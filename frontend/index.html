<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MarketML - Persona Builder</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        .header {
            text-align: center;
            color: white;
            margin-bottom: 40px;
        }

        .header h1 {
            font-size: 3em;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.2);
        }

        .header p {
            font-size: 1.2em;
            opacity: 0.9;
        }

        .card {
            background: white;
            border-radius: 12px;
            padding: 30px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            margin-bottom: 20px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: #333;
        }

        .form-group input,
        .form-group textarea {
            width: 100%;
            padding: 12px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 16px;
            transition: border-color 0.3s;
        }

        .form-group input:focus,
        .form-group textarea:focus {
            outline: none;
            border-color: #667eea;
        }

        .btn {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 15px 40px;
            font-size: 18px;
            font-weight: 600;
            border-radius: 8px;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            width: 100%;
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(102, 126, 234, 0.4);
        }

        .btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .progress-container {
            display: none;
            margin-top: 20px;
        }

        .progress-bar-container {
            background: #f0f0f0;
            border-radius: 10px;
            overflow: hidden;
            height: 30px;
            margin-bottom: 15px;
        }

        .progress-bar {
            background: linear-gradient(90deg, #667eea 0%, #764ba2 100%);
            height: 100%;
            transition: width 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: 600;
        }

        .progress-steps {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 10px;
        }

        .progress-step {
            padding: 10px;
            background: #f8f8f8;
            border-radius: 6px;
            font-size: 14px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .progress-step.active {
            background: #e8f4f8;
            border: 2px solid #667eea;
        }

        .progress-step.completed {
            background: #e8f8f0;
            color: #10b981;
        }

        .step-icon {
            font-size: 20px;
        }

        .persona-result {
            display: none;
        }

        .persona-header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 30px;
            border-radius: 12px 12px 0 0;
            margin: -30px -30px 30px -30px;
        }

        .persona-header h2 {
            font-size: 2em;
            margin-bottom: 10px;
        }

        .confidence-badge {
            display: inline-block;
            padding: 6px 12px;
            background: rgba(255,255,255,0.2);
            border-radius: 20px;
            font-size: 14px;
        }

        .scores-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .score-card {
            text-align: center;
            padding: 20px;
            background: #f8f8f8;
            border-radius: 8px;
        }

        .score-value {
            font-size: 3em;
            font-weight: bold;
            color: #667eea;
            margin: 10px 0;
        }

        .score-label {
            color: #666;
            font-size: 14px;
        }

        .tier-badge {
            display: inline-block;
            padding: 8px 16px;
            background: #10b981;
            color: white;
            border-radius: 20px;
            font-weight: 600;
            margin-top: 10px;
        }

        .section {
            margin-bottom: 30px;
        }

        .section h3 {
            color: #333;
            margin-bottom: 15px;
            padding-bottom: 10px;
            border-bottom: 2px solid #e0e0e0;
        }

        .narrative {
            line-height: 1.8;
            color: #555;
            background: #f8f8f8;
            padding: 20px;
            border-radius: 8px;
            border-left: 4px solid #667eea;
        }

        .insights-list {
            list-style: none;
        }

        .insights-list li {
            padding: 12px;
            margin-bottom: 10px;
            background: #f8f8f8;
            border-radius: 6px;
            border-left: 3px solid #667eea;
        }

        .insights-list li:before {
            content: "💡 ";
            margin-right: 8px;
        }

        .actions-list li:before {
            content: "✓ ";
            color: #10b981;
        }

        .error-message {
            background: #fee;
            color: #c33;
            padding: 15px;
            border-radius: 8px;
            margin-top: 20px;
            display: none;
        }

        .btn-secondary {
            background: #6c757d;
            margin-top: 20px;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        .loading {
            animation: pulse 1.5s ease-in-out infinite;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🎯 MarketML</h1>
            <p>AI-Powered Marketing Persona Builder</p>
        </div>

        <div class="card" id="inputCard">
            <h2 style="margin-bottom: 20px; color: #333;">Generate Business Persona</h2>
            <form id="personaForm">
                <div class="form-group">
                    <label for="name">Name / Business Name *</label>
                    <input type="text" id="name" required placeholder="e.g., Yogesh Khandge or Noya Furniture">
                </div>
                <div class="form-group">
                    <label for="location">Location *</label>
                    <input type="text" id="location" required placeholder="e.g., Pune, Maharashtra">
                </div>
                <div class="form-group">
                    <label for="description">Description (Optional)</label>
                    <textarea id="description" rows="3" placeholder="Additional context about the business..."></textarea>
                </div>
                <button type="submit" class="btn" id="generateBtn">Generate Persona</button>
            </form>

            <div class="progress-container" id="progressContainer">
                <h3 style="margin-bottom: 15px; color: #333;">Generating Persona...</h3>
                <div class="progress-bar-container">
                    <div class="progress-bar" id="progressBar">0%</div>
                </div>
                <div class="progress-steps" id="progressSteps"></div>
            </div>

            <div class="error-message" id="errorMessage"></div>
        </div>

        <div class="card persona-result" id="personaResult">
            <div class="persona-header">
                <h2 id="personaName"></h2>
                <p id="personaShortNarrative" style="font-size: 1.1em; margin: 10px 0;"></p>
                <span class="confidence-badge" id="confidenceBadge"></span>
            </div>

            <div class="scores-grid">
                <div class="score-card">
                    <div class="score-label">Business Maturity</div>
                    <div class="score-value" id="maturityScore">0</div>
                    <div class="score-label">out of 100</div>
                </div>
                <div class="score-card">
                    <div class="score-label">Marketing Readiness</div>
                    <div class="score-value" id="readinessScore">0</div>
                    <div class="score-label">out of 100</div>
                </div>
                <div class="score-card">
                    <div class="score-label">Budget Capacity</div>
                    <div class="score-value" id="budgetScore">0</div>
                    <div class="score-label">out of 100</div>
                </div>
            </div>

            <div style="text-align: center; margin-bottom: 30px;">
                <span class="tier-badge" id="tierBadge"></span>
            </div>

            <div class="section">
                <h3>📝 Business Profile</h3>
                <div class="narrative" id="narrative"></div>
            </div>

            <div class="section">
                <h3>💡 Marketing Insights</h3>
                <ul class="insights-list" id="insightsList"></ul>
            </div>

            <div class="section">
                <h3>✓ Recommended Actions</h3>
                <ul class="insights-list actions-list" id="actionsList"></ul>
            </div>

            <button class="btn btn-secondary" onclick="resetForm()">Generate Another Persona</button>
        </div>
    </div>

    <script>
        const API_BASE = 'http://localhost:8000/v1';
        let pollInterval;

        const form = document.getElementById('personaForm');
        const generateBtn = document.getElementById('generateBtn');
        const progressContainer = document.getElementById('progressContainer');
        const progressBar = document.getElementById('progressBar');
        const progressSteps = document.getElementById('progressSteps');
        const errorMessage = document.getElementById('errorMessage');
        const inputCard = document.getElementById('inputCard');
        const personaResult = document.getElementById('personaResult');

        const steps = [
            { icon: '🔍', label: 'Initializing' },
            { icon: '🌐', label: 'Scraping Data' },
            { icon: '🧠', label: 'Extracting Entities' },
            { icon: '📊', label: 'Building Context' },
            { icon: '⚙️', label: 'Computing Features' },
            { icon: '🎯', label: 'Scoring' },
            { icon: '✍️', label: 'Generating' },
            { icon: '✅', label: 'Validating' }
        ];

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            await generatePersona();
        });

        async function generatePersona() {
            const name = document.getElementById('name').value;
            const location = document.getElementById('location').value;
            const description = document.getElementById('description').value;

            // Show progress
            generateBtn.disabled = true;
            progressContainer.style.display = 'block';
            errorMessage.style.display = 'none';
            personaResult.style.display = 'none';

            // Initialize progress steps
            progressSteps.innerHTML = steps.map((step, i) => `
                <div class="progress-step" id="step-${i}">
                    <span class="step-icon">${step.icon}</span>
                    <span>${step.label}</span>
                </div>
            `).join('');

            try {
                // Submit generation request
                const response = await fetch(`${API_BASE}/personas/generate`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ name, location, description })
                });

                if (!response.ok) throw new Error('Failed to start generation');

                const { job_id } = await response.json();

                // Poll for progress
                pollInterval = setInterval(() => checkJobStatus(job_id), 500);

            } catch (error) {
                showError(error.message);
            }
        }

        async function checkJobStatus(jobId) {
            try {
                const response = await fetch(`${API_BASE}/jobs/${jobId}`);
                if (!response.ok) throw new Error('Failed to check status');

                const job = await response.json();
                
                // Update progress bar
                progressBar.style.width = `${job.progress}%`;
                progressBar.textContent = `${job.progress}%`;

                // Update step indicators
                const currentStepIndex = Math.floor(job.progress / 12.5);
                steps.forEach((_, i) => {
                    const stepEl = document.getElementById(`step-${i}`);
                    if (i < currentStepIndex) {
                        stepEl.className = 'progress-step completed';
                    } else if (i === currentStepIndex) {
                        stepEl.className = 'progress-step active';
                    } else {
                        stepEl.className = 'progress-step';
                    }
                });

                // Check if completed
                if (job.status === 'completed') {
                    clearInterval(pollInterval);
                    await displayPersona(job.persona_id);
                } else if (job.status === 'failed') {
                    clearInterval(pollInterval);
                    throw new Error(job.error_message || 'Generation failed');
                }

            } catch (error) {
                clearInterval(pollInterval);
                showError(error.message);
            }
        }

        async function displayPersona(personaId) {
            try {
                const response = await fetch(`${API_BASE}/personas/${personaId}`);
                if (!response.ok) throw new Error('Failed to fetch persona');

                const persona = await response.json();
                
                // Hide input, show result
                inputCard.style.display = 'none';
                personaResult.style.display = 'block';

                // Fill in data
                document.getElementById('personaName').textContent = persona.structured.name;
                document.getElementById('personaShortNarrative').textContent = persona.short_narrative;
                document.getElementById('confidenceBadge').textContent = 
                    `Confidence: ${(persona.confidence_score * 100).toFixed(0)}%`;

                document.getElementById('maturityScore').textContent = 
                    Math.round(persona.structured.scores.maturity);
                document.getElementById('readinessScore').textContent = 
                    Math.round(persona.structured.scores.marketing_readiness);
                document.getElementById('budgetScore').textContent = 
                    Math.round(persona.structured.scores.budget_capacity);

                const tierNames = ['Not Ready', 'Launch Pack', 'Growth Pack', 'Scale Pack', 'Enterprise'];
                document.getElementById('tierBadge').textContent = 
                    `Recommended: ${tierNames[persona.structured.scores.recommended_tier] || 'Unknown'}`;

                document.getElementById('narrative').textContent = persona.narrative;

                const insightsList = document.getElementById('insightsList');
                insightsList.innerHTML = persona.marketing_insights
                    .map(insight => `<li>${insight}</li>`)
                    .join('');

                const actionsList = document.getElementById('actionsList');
                actionsList.innerHTML = persona.recommended_actions
                    .map(action => `<li>${action}</li>`)
                    .join('');

                // Scroll to result
                personaResult.scrollIntoView({ behavior: 'smooth' });

            } catch (error) {
                showError(error.message);
            }
        }

        function showError(message) {
            errorMessage.textContent = `Error: ${message}`;
            errorMessage.style.display = 'block';
            generateBtn.disabled = false;
            progressContainer.style.display = 'none';
        }

        function resetForm() {
            inputCard.style.display = 'block';
            personaResult.style.display = 'none';
            generateBtn.disabled = false;
            progressContainer.style.display = 'none';
            form.reset();
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }
    </script>
</body>
</html>
