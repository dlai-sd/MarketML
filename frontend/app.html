<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MarketML - Persona Builder</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .card {
            background: white;
            border-radius: 16px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            max-width: 600px;
            width: 100%;
            padding: 40px;
        }
        h1 {
            color: #1f2937;
            margin-bottom: 8px;
            font-size: 28px;
        }
        .subtitle {
            color: #6b7280;
            margin-bottom: 32px;
            font-size: 14px;
        }
        .form-group {
            margin-bottom: 20px;
        }
        label {
            display: block;
            color: #374151;
            font-weight: 600;
            margin-bottom: 8px;
            font-size: 14px;
        }
        input, textarea {
            width: 100%;
            padding: 12px 16px;
            border: 2px solid #e5e7eb;
            border-radius: 8px;
            font-size: 16px;
            transition: border-color 0.2s;
        }
        input:focus, textarea:focus {
            outline: none;
            border-color: #667eea;
        }
        textarea {
            resize: vertical;
            min-height: 80px;
        }
        button {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }
        button:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 8px 16px rgba(102, 126, 234, 0.4);
        }
        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }
        .progress {
            display: none;
            margin-top: 24px;
            padding: 24px;
            background: #f9fafb;
            border-radius: 8px;
        }
        .progress.active { display: block; }
        .progress-bar {
            height: 8px;
            background: #e5e7eb;
            border-radius: 4px;
            overflow: hidden;
            margin-bottom: 16px;
        }
        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #667eea 0%, #764ba2 100%);
            width: 0%;
            transition: width 0.3s;
        }
        .status {
            color: #6b7280;
            font-size: 14px;
            text-align: center;
        }
        .result {
            display: none;
            margin-top: 24px;
            padding: 24px;
            background: #f0fdf4;
            border: 2px solid #10b981;
            border-radius: 8px;
        }
        .result.active { display: block; }
        .result h2 {
            color: #065f46;
            margin-bottom: 16px;
            font-size: 20px;
        }
        .result-data {
            background: white;
            padding: 16px;
            border-radius: 8px;
            max-height: 400px;
            overflow-y: auto;
            font-size: 14px;
            line-height: 1.6;
        }
        .error {
            display: none;
            margin-top: 16px;
            padding: 16px;
            background: #fef2f2;
            border: 2px solid #ef4444;
            border-radius: 8px;
            color: #991b1b;
        }
        .error.active { display: block; }
        .badge {
            display: inline-block;
            padding: 4px 12px;
            background: #667eea;
            color: white;
            border-radius: 12px;
            font-size: 12px;
            font-weight: 600;
            margin-bottom: 8px;
        }
    </style>
</head>
<body>
    <div class="card">
        <span class="badge">🎯 AI-Powered</span>
        <h1>MarketML Persona Builder</h1>
        <p class="subtitle">Generate comprehensive business personas in seconds</p>

        <form id="form">
            <div class="form-group">
                <label for="name">Name / Business Name *</label>
                <input type="text" id="name" required placeholder="e.g., Yogesh Khandge or Noya Furniture">
            </div>
            
            <div class="form-group">
                <label for="location">Location *</label>
                <input type="text" id="location" required placeholder="e.g., Pune, Maharashtra">
            </div>
            
            <div class="form-group">
                <label for="description">Additional Context (Optional)</label>
                <textarea id="description" placeholder="Any additional information about the business..."></textarea>
            </div>

            <button type="submit" id="submitBtn">Generate Persona</button>
        </form>

        <div class="progress" id="progress">
            <div class="progress-bar">
                <div class="progress-fill" id="progressFill"></div>
            </div>
            <div class="status" id="status">Initializing...</div>
        </div>

        <div class="error" id="error"></div>

        <div class="result" id="result">
            <h2>✅ Persona Generated Successfully!</h2>
            <div class="result-data" id="resultData"></div>
        </div>
    </div>

    <script>
        const API_URL = '/v1';
        let pollInterval = null;

        // Wait for DOM to be ready
        document.addEventListener('DOMContentLoaded', function() {
            const form = document.getElementById('form');
            const submitBtn = document.getElementById('submitBtn');
            
            console.log('🎯 MarketML loaded, API URL:', API_URL);
            
            form.addEventListener('submit', async (e) => {
                e.preventDefault();
                e.stopPropagation();
                console.log('📝 Form submitted, preventing default');
                await generatePersona();
                return false;
            });
        });

        async function generatePersona() {
            const submitBtn = document.getElementById('submitBtn');
            const progress = document.getElementById('progress');
            const progressFill = document.getElementById('progressFill');
            const status = document.getElementById('status');
            const error = document.getElementById('error');
            const result = document.getElementById('result');
            
            const name = document.getElementById('name').value;
            const location = document.getElementById('location').value;
            const description = document.getElementById('description').value;

            console.log('🚀 generatePersona() called');
            console.log('📦 Input values:', { name, location, description });

            // Validate inputs
            if (!name || !location) {
                showError('Please fill in Name and Location fields');
                return;
            }

            // Reset UI
            submitBtn.disabled = true;
            submitBtn.textContent = 'Generating...';
            progress.classList.add('active');
            error.classList.remove('active');
            result.classList.remove('active');
            progressFill.style.width = '0%';
            status.textContent = 'Starting generation...';

            try {
                console.log('🚀 Sending request to:', `${API_URL}/personas/generate`);
                console.log('📦 Payload:', { name, location, description });
                
                // Step 1: Submit generation request
                const response = await fetch(`${API_URL}/personas/generate`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ name, location, description })
                });

                console.log('📡 Response status:', response.status);
                
                if (!response.ok) {
                    const errorData = await response.json().catch(() => ({}));
                    console.error('❌ Error response:', errorData);
                    throw new Error(errorData.detail || `HTTP ${response.status}`);
                }

                const data = await response.json();
                console.log('✅ Job started:', data);
                const { job_id } = data;

                // Step 2: Poll for completion
                pollInterval = setInterval(() => checkJobStatus(job_id), 500);

            } catch (err) {
                console.error('💥 Exception:', err);
                showError(err.message);
            }
        }

        async function checkJobStatus(jobId) {
            const progressFill = document.getElementById('progressFill');
            const status = document.getElementById('status');
            
            try {
                const response = await fetch(`${API_URL}/jobs/${jobId}`);
                if (!response.ok) throw new Error('Failed to check status');

                const job = await response.json();
                console.log('📊 Job status:', job.status, `${job.progress}%`);
                
                // Update progress
                progressFill.style.width = `${job.progress}%`;
                status.textContent = job.current_step || 'Processing...';

                if (job.status === 'completed') {
                    clearInterval(pollInterval);
                    console.log('🎉 Job completed! Persona ID:', job.persona_id);
                    await displayPersona(job.persona_id);
                } else if (job.status === 'failed') {
                    clearInterval(pollInterval);
                    throw new Error(job.error_message || 'Generation failed');
                }

            } catch (err) {
                console.error('❌ Status check error:', err);
                clearInterval(pollInterval);
                showError(err.message);
            }
        }
ole.log('📥 Fetching persona:', personaId);
                const response = await fetch(`${API_URL}/personas/${personaId}`);
                if (!response.ok) throw new Error('Failed to fetch persona');

                const persona = await response.json();
                console.log('✨ Persona data:', persona);
                
                // Get DOM elements
                const progress = document.getElementById('progress');
                const result = document.getElementById('result');
                const resultData = document.getElementById('resultData');
                const submitBtn = document.getElementById('submitBtn');
                
                // Display result
                progress.classList.remove('active');
                result.classList.add('active');
                
                const structured = persona.structured || {};
                const location = structured.location || {};
                const scores = structured.scores || {};
                
                resultData.innerHTML = `
                    <p><strong>Name:</strong> ${structured.name || 'N/A'}</p>
                    <p><strong>Location:</strong> ${location.city || 'N/A'}, ${location.state || 'N/A'}</p>
                    <p><strong>Confidence Score:</strong> ${(persona.confidence_score * 100).toFixed(1)}%</p>
                    <hr style="margin: 16px 0; border: none; border-top: 1px solid #e5e7eb;">
                    <p><strong>Business Maturity:</strong> ${scores.maturity?.toFixed(1) || 0}/100</p>
                    <p><strong>Marketing Readiness:</strong> ${scores.marketing_readiness?.toFixed(1) || 0}/100</p>
                    <p><strong>Budget Capacity:</strong> ${scores.budget_capacity?.toFixed(1) || 0}/100</p>
                    <p><strong>Recommended Tier:</strong> ${scores.recommended_tier || 'N/A'}</p>
                    <hr style="margin: 16px 0; border: none; border-top: 1px solid #e5e7eb;">
                    <p><strong>Narrative:</strong></p>
                    <p style="color: #6b7280;">${persona.narrative || 'No narrative available'}</p>
                    <hr style="margin: 16px 0; border: none; border-top: 1px solid #e5e7eb;">
                    <p><strong>Marketing Insights:</strong></p>
                    <ul style="margin-left: 20px; color: #6b7280;">
                        ${(persona.marketing_insights || ['No insights available']).map(action => `<li>${action}</li>`).join('')}
                    </ul>
                    <p><strong>Recommended Actions:</strong></p>
                    <ul style="margin-left: 20px; color: #6b7280;">
                        ${(persona.recommended_actions || ['No actions available']).map(action => `<li>${action}</li>`).join('')}
                    </ul>
                `;

                submitBtn.disabled = false;
                submitBtn.textContent = 'Generate Another';
                console.log('🎯 Persona displayed successfully!');

            } catch (err) {
                console.error('❌ Display error:', err);isabled = false;
                submitBtn.textContent = 'Generate Another';

            } catch (err) {
                showError(err.message);
            }
        }

        function showError(message) {
            const submitBtn = document.getElementById('submitBtn');
            const progress = document.getElementById('progress');
            const error = document.getElementById('error');
            
            console.error('❌ Showing error:', message);
            error.textContent = `❌ Error: ${message}`;
            error.classList.add('active');
            progress.classList.remove('active');
            submitBtn.disabled = false;
            submitBtn.textContent = 'Try Again';
        }
    </script>
</body>
</html>
