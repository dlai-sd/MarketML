<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Digital Marketing Assessment - Working Version</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            padding: 20px;
            min-height: 100vh;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: white;
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
        }
        h1 {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            text-align: center;
            font-size: 42px;
            margin-bottom: 10px;
        }
        .subtitle {
            text-align: center;
            color: #666;
            font-size: 16px;
            margin-bottom: 30px;
        }
        .input-section {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin: 30px 0;
        }
        input {
            flex: 1;
            max-width: 500px;
            padding: 18px 25px;
            font-size: 18px;
            border: 3px solid #667eea;
            border-radius: 50px;
            outline: none;
            transition: all 0.3s;
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.2);
        }
        input:focus {
            border-color: #764ba2;
            box-shadow: 0 8px 25px rgba(118, 75, 162, 0.3);
            transform: translateY(-2px);
        }
        button {
            padding: 18px 45px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 50px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s;
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.3);
        }
        button:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 30px rgba(102, 126, 234, 0.5);
        }
        button:active {
            transform: translateY(-1px);
        }
        #status {
            margin-top: 30px;
        }
        #results {
            margin-top: 30px;
        }
        .result-card {
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            padding: 25px;
            margin: 15px 0;
            border-left: 6px solid #667eea;
            border-radius: 15px;
            transition: all 0.3s;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
            cursor: pointer;
            position: relative;
        }
        .result-card:hover {
            transform: translateX(5px);
            box-shadow: 0 8px 25px rgba(0,0,0,0.15);
        }
        .result-card::after {
            content: '🔍 Click to expand';
            position: absolute;
            top: 10px;
            right: 15px;
            font-size: 11px;
            color: #667eea;
            font-weight: bold;
            opacity: 0;
            transition: opacity 0.3s;
        }
        .result-card:hover::after {
            opacity: 1;
        }
        .result-card-expanded {
            position: fixed !important;
            top: 50% !important;
            left: 50% !important;
            transform: translate(-50%, -50%) !important;
            width: 95vw !important;
            max-width: 1600px !important;
            height: 95vh !important;
            max-height: 95vh !important;
            overflow-y: auto !important;
            z-index: 10001 !important;
            margin: 0 !important;
            padding: 40px !important;
            box-shadow: 0 25px 80px rgba(0,0,0,0.4) !important;
            cursor: default !important;
        }
        .result-card-expanded::after {
            content: '✕ Click outside to close';
            opacity: 1;
            font-size: 13px;
        }
        .result-card-expanded::-webkit-scrollbar {
            width: 12px;
        }
        .result-card-expanded::-webkit-scrollbar-track {
            background: #f1f1f1;
            border-radius: 10px;
        }
        .result-card-expanded::-webkit-scrollbar-thumb {
            background: #667eea;
            border-radius: 10px;
        }
        .result-card-expanded::-webkit-scrollbar-thumb:hover {
            background: #5568d3;
        }
        .result-card-expanded h3 {
            font-size: 32px !important;
            margin-bottom: 20px !important;
        }
        .result-card-expanded .score {
            font-size: 40px !important;
            margin: 15px 0 !important;
        }
        .result-card-expanded p {
            font-size: 16px !important;
            line-height: 1.8 !important;
            margin: 10px 0 !important;
        }
        .result-card-expanded strong {
            font-size: 16px !important;
        }
        .result-card-expanded > div[style*="grid"] {
            gap: 30px !important;
            margin-top: 25px !important;
        }
        .result-card-expanded > div[style*="grid"] > div {
            font-size: 15px !important;
        }
        .result-card-expanded > div[style*="grid"] p {
            margin: 8px 0 !important;
        }
        .card-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(5px);
            z-index: 10000;
        }
        .card-overlay.active {
            display: block;
        }
        .score {
            font-size: 32px;
            font-weight: bold;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        .dimensions-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 20px;
            margin: 25px 0;
        }
        .dimension-card {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 25px;
            border-radius: 20px;
            cursor: pointer;
            transition: all 0.3s;
            box-shadow: 0 8px 20px rgba(102, 126, 234, 0.3);
            position: relative;
            overflow: hidden;
        }
        .dimension-card::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle, rgba(255,255,255,0.1) 0%, transparent 70%);
            transform: scale(0);
            transition: transform 0.5s;
        }
        .dimension-card:hover::before {
            transform: scale(1);
        }
        .dimension-card:hover {
            transform: translateY(-10px) scale(1.02);
            box-shadow: 0 15px 40px rgba(102, 126, 234, 0.5);
        }
        .dimension-name {
            font-size: 18px;
            font-weight: bold;
            letter-spacing: 0.5px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.2);
        }
        .explanation-panel {
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            border-left: 6px solid #667eea;
            padding: 30px;
            margin: 25px 0;
            border-radius: 15px;
            display: none;
            box-shadow: 0 8px 25px rgba(0,0,0,0.1);
        }
        .explanation-panel.active {
            display: block;
            animation: slideIn 0.4s ease;
        }
        @keyframes slideIn {
            from { opacity: 0; transform: translateY(-20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .explanation-title {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            font-size: 24px;
            font-weight: bold;
            margin-bottom: 15px;
        }
        .roadmap {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 15px;
            padding: 30px;
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            border-radius: 20px;
            box-shadow: 0 8px 25px rgba(0,0,0,0.1);
        }
        .milestone {
            flex: 1;
            max-width: 140px;
            text-align: center;
            padding: 20px 15px;
            border-radius: 20px;
            font-size: 11px;
            font-weight: bold;
            transition: all 0.4s ease;
            position: relative;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
        }
        .milestone.completed {
            background: linear-gradient(135deg, #11998e 0%, #38ef7d 100%);
            color: white;
            box-shadow: 0 8px 20px rgba(17, 153, 142, 0.4);
        }
        .milestone.current {
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            color: white;
            box-shadow: 0 8px 25px rgba(240, 147, 251, 0.6);
            transform: scale(1.1);
            position: relative;
        }
        .milestone.current::before {
            content: '';
            position: absolute;
            top: -5px;
            left: -5px;
            right: -5px;
            bottom: -5px;
            border: 4px solid #f093fb;
            border-radius: 20px;
            border-top-color: transparent;
            animation: spin 1.5s linear infinite;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        .milestone.pending {
            background: #e0e0e0;
            color: #999;
        }
        .milestone-icon {
            font-size: 32px;
            display: block;
            margin-bottom: 8px;
            filter: drop-shadow(2px 2px 4px rgba(0,0,0,0.2));
        }
        .connector {
            flex: 0 0 40px;
            height: 8px;
            background: #e0e0e0;
            border-radius: 4px;
            position: relative;
            overflow: hidden;
        }
        .connector.active {
            background: linear-gradient(90deg, #11998e 0%, #38ef7d 100%);
            animation: shimmer 1.5s infinite;
        }
        .connector.active::after {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.6), transparent);
            animation: slide 1.5s infinite;
        }
        @keyframes shimmer {
            0%, 100% { opacity: 0.8; }
            50% { opacity: 1; }
        }
        @keyframes slide {
            0% { left: -100%; }
            100% { left: 100%; }
        }
        .milestone-time {
            font-size: 9px;
            opacity: 0.9;
            margin-top: 5px;
            font-weight: normal;
        }
        #searchResults {
            margin: 20px 0;
        }
        .search-results-container {
            max-height: 400px;
            overflow-y: auto;
            border: 1px solid #e0e0e0;
            border-radius: 12px;
            padding: 10px;
            margin-bottom: 15px;
        }
        .search-results-container::-webkit-scrollbar {
            width: 8px;
        }
        .search-results-container::-webkit-scrollbar-track {
            background: #f1f1f1;
            border-radius: 10px;
        }
        .search-results-container::-webkit-scrollbar-thumb {
            background: #667eea;
            border-radius: 10px;
        }
        .search-results-container::-webkit-scrollbar-thumb:hover {
            background: #5568d3;
        }
        .search-result-card {
            background: #f8f9fa;
            border: 2px solid #e0e0e0;
            border-radius: 12px;
            padding: 15px;
            margin: 8px 0;
            cursor: pointer;
            transition: all 0.3s ease;
            position: relative;
        }
        .search-result-card:hover {
            border-color: #667eea;
            box-shadow: 0 4px 12px rgba(102, 126, 234, 0.2);
            transform: translateY(-2px);
        }
        .search-result-card.selected {
            border-color: #667eea;
            border-width: 3px;
            background: linear-gradient(135deg, rgba(102, 126, 234, 0.2) 0%, rgba(118, 75, 162, 0.2) 100%);
            box-shadow: 0 6px 20px rgba(102, 126, 234, 0.4);
            transform: translateY(-2px);
        }
        .search-result-card.selected .search-result-title::before {
            content: '✓ ';
            color: #667eea;
            font-weight: bold;
        }
        .selection-badge {
            display: none;
            position: absolute;
            top: 10px;
            right: 10px;
            background: #667eea;
            color: white;
            padding: 5px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: bold;
            box-shadow: 0 2px 8px rgba(102, 126, 234, 0.4);
        }
        .search-result-card.selected .selection-badge {
            display: block;
        }
        .company-details {
            display: none;
            margin-top: 12px;
            padding-top: 12px;
            border-top: 1px solid #ddd;
        }
        .search-result-card.selected .company-details {
            display: block;
        }
        .detail-row {
            display: flex;
            margin: 8px 0;
            font-size: 13px;
        }
        .detail-label {
            font-weight: bold;
            color: #667eea;
            min-width: 80px;
        }
        .detail-value {
            color: #555;
            word-break: break-all;
        }
        .search-result-title {
            font-size: 20px;
            font-weight: bold;
            color: #333;
            margin-bottom: 8px;
        }
        .search-result-description {
            color: #666;
            font-size: 14px;
            line-height: 1.5;
            margin-bottom: 10px;
        }
        .search-result-meta {
            display: flex;
            gap: 15px;
            font-size: 12px;
            color: #999;
        }
        .confidence-badge {
            padding: 4px 10px;
            border-radius: 12px;
            font-weight: bold;
            font-size: 11px;
        }
        .confidence-high {
            background: #d4edda;
            color: #155724;
        }
        .confidence-medium {
            background: #fff3cd;
            color: #856404;
        }
        .confidence-low {
            background: #f8d7da;
            color: #721c24;
        }
        .proceed-btn {
            display: block;
            margin: 20px auto;
            padding: 12px 30px;
            background: linear-gradient(135deg, #11998e 0%, #38ef7d 100%);
            color: white;
            border: none;
            border-radius: 25px;
            font-size: 16px;
            font-weight: bold;
            cursor: not-allowed;
            transition: all 0.3s ease;
            opacity: 0.4;
            pointer-events: none;
            filter: grayscale(50%);
        }
        .proceed-btn.active {
            opacity: 1;
            pointer-events: auto;
            cursor: pointer;
            filter: grayscale(0%);
        }
        .proceed-btn:hover {
            transform: scale(1.05);
            box-shadow: 0 5px 15px rgba(17, 153, 142, 0.4);
        }
        .proceed-btn:active {
            transform: scale(0.98);
        }
        
        /* 2FA Modal Styles */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.7);
            z-index: 1000;
            align-items: center;
            justify-content: center;
        }
        .modal-overlay.active {
            display: flex;
        }
        .modal-content {
            background: white;
            padding: 40px;
            border-radius: 20px;
            max-width: 500px;
            width: 90%;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            animation: modalSlideIn 0.3s ease;
        }
        @keyframes modalSlideIn {
            from { opacity: 0; transform: translateY(-50px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .modal-title {
            font-size: 24px;
            font-weight: bold;
            margin-bottom: 10px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .modal-input {
            width: 100%;
            padding: 15px;
            margin: 10px 0;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            font-size: 16px;
            box-sizing: border-box;
        }
        .modal-input:focus {
            outline: none;
            border-color: #667eea;
        }
        .modal-btn {
            width: 100%;
            padding: 15px;
            margin: 10px 0;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        .modal-btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }
        .modal-btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }
        .modal-btn-secondary {
            background: #f0f0f0;
            color: #666;
        }
        .modal-hint {
            font-size: 12px;
            color: #999;
            text-align: center;
            margin-top: 10px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🎯 Digital Marketing Assessment</h1>
        
        <div class="input-section">
            <input type="text" id="companyInput" placeholder="e.g., Balaji Enterprise, Salesforce, HubSpot" value="">
            <button id="searchBtn" onclick="searchCompany()">🔍 Search Company</button>
        </div>
        
        <div id="searchResults"></div>
        <div id="status"></div>
        <div id="results"></div>
        <div id="explanation" class="explanation-panel"></div>
    </div>
    
    <!-- 2FA Modal -->
    <div id="otpModal" class="modal-overlay">
        <div class="modal-content">
            <h3 class="modal-title">🔐 Verification Required</h3>
            <p style="color:#666;margin-bottom:20px;">Enter OTP to proceed with assessment</p>
            
            <input type="text" id="otpInput" class="modal-input" placeholder="Enter 6-digit OTP" maxlength="6" />
            <button class="modal-btn modal-btn-primary" onclick="verifyOTP()">✓ Verify OTP</button>
            <button class="modal-btn modal-btn-secondary" onclick="closeOTPModal()">Cancel</button>
            
            <div class="modal-hint">💡 Test OTP: 123456</div>
        </div>
    </div>

    <script>
        // Clear any lingering status messages on page load
        window.addEventListener('DOMContentLoaded', function() {
            document.getElementById('status').innerHTML = '';
            document.getElementById('results').innerHTML = '';
        });
        
        let jobId = null;
        let pollTimer = null;
        let maxMilestoneReached = 0; // Track highest milestone to prevent going backward
        
        const roadmapMilestones = [
            { id: 'init', name: 'Initialize', icon: '🚀', time: '2s' },
            { id: 'competitors', name: 'Find Competitors', icon: '🔍', time: '15s' },
            { id: 'scraping', name: 'Scrape Data', icon: '🌐', time: '45s' },
            { id: 'analysis', name: 'Analyze', icon: '📊', time: '10s' },
            { id: 'scoring', name: 'Score', icon: '⭐', time: '5s' },
            { id: 'complete', name: 'Complete', icon: '✅', time: '0s' }
        ];
        
        function updateRoadmap(currentStep, totalProgress, isComplete) {
            let currentIndex = -1;
            
            // Determine current milestone based on actual progress
            if (totalProgress === 0) currentIndex = 0;
            else if (totalProgress === 1) currentIndex = 1; // Finding competitors
            else if (totalProgress >= 2 && totalProgress <= 10) currentIndex = 2; // Scraping (each entity)
            else if (totalProgress === 11 && !isComplete) currentIndex = 5; // Complete (orange)
            else if (isComplete) currentIndex = 6; // All green including Complete
            
            // Never go backward - only move forward
            if (currentIndex > maxMilestoneReached) {
                maxMilestoneReached = currentIndex;
            } else {
                currentIndex = maxMilestoneReached;
            }
            
            let html = '<div class="roadmap">';
            roadmapMilestones.forEach(function(milestone, idx) {
                let status = 'pending';
                if (idx < currentIndex) status = 'completed';
                else if (idx === currentIndex) status = 'current';
                
                html += '<div class="milestone ' + status + '">';
                html += '<span class="milestone-icon">' + milestone.icon + '</span>';
                html += '<span>' + milestone.name + '</span>';
                html += '<div class="milestone-time">' + milestone.time + '</div>';
                html += '</div>';
                
                // Add arrow between milestones (except after last one)
                if (idx < roadmapMilestones.length - 1) {
                    let connectorClass = idx < currentIndex ? 'connector active' : 'connector';
                    html += '<div class="' + connectorClass + '"></div>';
                }
            });
            html += '</div>';
            
            return html;
        }
        
        const dimensionExplanations = {
            content_marketing: {
                title: "Content marketing",
                description: "Measures the quality and consistency of content creation. High scores indicate regular blog posts, whitepapers, case studies, and educational resources that engage and inform the target audience.",
                indicators: ["Blog frequency", "Content depth", "Resource library", "Educational materials"]
            },
            seo_presence: {
                title: "SEO presence",
                description: "Evaluates search engine visibility and organic reach. Strong SEO presence means the company ranks well for relevant keywords and has optimized content structure.",
                indicators: ["Search rankings", "Keyword optimization", "Backlink quality", "Domain authority"]
            },
            social_engagement: {
                title: "Social engagement",
                description: "Assesses active participation on social media platforms. High engagement shows consistent posting, audience interaction, and community building across channels.",
                indicators: ["Follower count", "Post frequency", "Engagement rate", "Platform diversity"]
            },
            conversion_signals: {
                title: "Conversion signals",
                description: "Evaluates the effectiveness of conversion-focused elements. Strong signals include clear CTAs, lead magnets, optimized landing pages, and user-friendly forms.",
                indicators: ["CTA presence", "Form optimization", "Landing pages", "Testimonials"]
            },
            brand_authority: {
                title: "Brand authority",
                description: "Measures brand recognition and reputation in the market. High authority comes from media mentions, industry recognition, awards, and positive reviews.",
                indicators: ["Media coverage", "Reviews", "Industry awards", "Brand mentions"]
            },
            technical_optimization: {
                title: "Technical optimization",
                description: "Assesses website technical performance and user experience. High scores indicate fast load times, mobile optimization, proper analytics, and technical SEO.",
                indicators: ["Page speed", "Mobile-friendly", "Analytics setup", "Technical SEO"]
            },
            thought_leadership: {
                title: "Thought leadership",
                description: "Evaluates the company's position as an industry expert. Strong thought leadership includes speaking engagements, published research, webinars, and industry contributions.",
                indicators: ["Speaking events", "Published research", "Webinars", "Industry influence"]
            }
        };
        
        let selectedCompany = null; // Track user's selection
        let searchMatches = []; // Store search results globally
        
        // Search for company matches
        async function searchCompany() {
            const query = document.getElementById('companyInput').value.trim();
            
            if (!query) {
                document.getElementById('searchResults').innerHTML = '<div style="text-align:center;color:#e74c3c;">❌ Please enter a company name</div>';
                return;
            }
            
            // Reset selection for new search
            selectedCompany = null;
            
            // Show loading
            document.getElementById('searchResults').innerHTML = '<div style="text-align:center;color:#667eea;">🔍 Searching for "' + query + '"...</div>';
            document.getElementById('searchBtn').disabled = true;
            document.getElementById('searchBtn').textContent = '🔍 Searching...';
            
            try {
                const response = await fetch('/api/search', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ query: query })
                });
                
                const data = await response.json();
                displaySearchResults(data.matches, query);
                
            } catch (error) {
                document.getElementById('searchResults').innerHTML = '<div style="text-align:center;color:#e74c3c;">❌ Search failed: ' + error.message + '</div>';
            } finally {
                document.getElementById('searchBtn').disabled = false;
                document.getElementById('searchBtn').textContent = '🔍 Search Company';
            }
        }

                return;

            document.querySelectorAll('.search-result-card').forEach(function(card) {

            // Mark as selected

            const otp = document.getElementById('otpInput').value.trim();
            
            if (!otp) {
                alert('Please enter OTP');
                return;
            }
            
            try {
                const response = await fetch('/api/verify-otp', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ 
                        otp: otp,
                        phone: '1234567890' // Mock data
                    })
                });
                
                const data = await response.json();
                
                if (data.verified) {
                    closeOTPModal();
                    startAssessment();
                } else {
                    alert('Invalid OTP. Please use: 123456');

            } catch (error) {

        async function executeMilestone(idx) {
            if (idx >= interactiveMilestones.length) {

            }
            
            currentMilestone = idx;
            const milestone = interactiveMilestones[idx];
            
            // Highlight current milestone
            const milestoneEl = document.getElementById(`milestone-${idx}`);
            if (milestoneEl) {
                milestoneEl.style.opacity = '1';

        async function proceedToNextMilestone(currentIdx) {
            // Get the button and show processing state
            const btnEl = document.getElementById(`milestone-${currentIdx}-btn`);
            if (btnEl) {
                btnEl.innerHTML = '⏳ Processing...';
                btnEl.disabled = true;
                btnEl.style.cursor = 'not-allowed';
                btnEl.style.opacity = '0.6';
            }
            
            // Update current milestone status to processing
            const statusEl = document.getElementById(`milestone-${currentIdx}-status`);
            if (statusEl) {
                statusEl.innerHTML = '⏳ In progress...';
                statusEl.style.color = '#667eea';
            }
            
            // If this is the last milestone, trigger assessment instead of moving forward
            if (currentIdx === interactiveMilestones.length - 1) {
                // Wait a moment for visual feedback
                await new Promise(resolve => setTimeout(resolve, 1000));
                
                // Hide the button
                if (btnEl) {
                    btnEl.style.display = 'none';
                }
                
                // Mark as complete
                if (statusEl) {
                    statusEl.innerHTML = '✅ Complete';
                    statusEl.style.color = '#4caf50';
                }
                
                const milestoneEl = document.getElementById(`milestone-${currentIdx}`);
                if (milestoneEl) {
                    milestoneEl.style.borderColor = '#4caf50';
                }
                
                // Show Close Assessment button
                const closeBtn = document.getElementById('closeAssessmentBtn');
                if (closeBtn) {
                    closeBtn.style.display = 'block';
                }
                
                // Actually run the assessment now
                runAssessment();
                return;
            }
            
            // Simulate work for current milestone
            await new Promise(resolve => setTimeout(resolve, 1500));
            
            // Mark current as complete
            if (statusEl) {
                statusEl.innerHTML = '✅ Complete';
                statusEl.style.color = '#4caf50';
            }
            
            const milestoneEl = document.getElementById(`milestone-${currentIdx}`);
            if (milestoneEl) {
                milestoneEl.style.borderColor = '#4caf50';
                milestoneEl.style.cursor = 'pointer'; // Make completed milestones clickable
            }
            
            // Show toggle icon for completed milestone
            const toggleIcon = document.getElementById(`milestone-${currentIdx}-toggle`);
            if (toggleIcon) {
                toggleIcon.style.display = 'block';
                toggleIcon.innerHTML = '▼'; // Set initial down arrow
            }
            
            // Hide the button
            if (btnEl) {
                btnEl.style.display = 'none';
            }
            
            // Move to next milestone
            await executeMilestone(currentIdx + 1);
        }

            try {
                // Start assessment
                const response = await fetch('/api/assess', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ subject: company })
                });
                
                const data = await response.json();
                jobId = data.job_id;
                
                // Start polling silently - milestone UI will show progress (poll every 1 second)
                pollTimer = setInterval(checkStatus, 1000);
                
            } catch (error) {
                document.getElementById('status').innerHTML = '❌ Error: ' + error.message;
            }
        }
        
        async function checkStatus() {
            if (!jobId) return;
            
            try {
                const response = await fetch('/api/assess/' + jobId);
                const data = await response.json();
                
                // Update status with roadmap
                const progress = data.progress || {};
                const completed = progress.completed || 0;
                const total = progress.total || 11;
                
                // Don't show status message during milestone journey - keep it clean
                
                // Show partial results if available
                if (data.partial_result && data.partial_result.subject) {
                    displayPartialResults(data.partial_result, false);
                }
                
                // Check if complete
                if (data.status === 'complete') {
                    clearInterval(pollTimer);
                    displayResults(data.result);
                    
                    // Show results under relevant milestones - ADD DEBUGGING
                    console.log('Assessment complete, populating milestone results...');
                    console.log('Result data:', data.result);
                    showMilestoneResults(data.result);
                    
                    // Verify content was added
                    setTimeout(() => {
                        for (let i = 0; i < 8; i++) {
                            const resultsDiv = document.getElementById(`milestone-${i}-results`);
                            if (resultsDiv) {
                                console.log(`Milestone ${i} results:`, resultsDiv.innerHTML.substring(0, 100));
                            }
                        }
                    }, 1000);
                }
                
                if (data.status === 'failed') {
                    clearInterval(pollTimer);
                    document.getElementById('status').innerHTML = '<p style="text-align:center; color:#f44336; font-weight:bold;">❌ Assessment failed: ' + (data.error || 'Unknown error') + '</p>';
                }
                
            } catch (error) {
                clearInterval(pollTimer);
                document.getElementById('status').innerHTML = '❌ Error checking status: ' + error.message;
            }
        }
        
        function displayPartialResults(result, isComplete) {
            isComplete = isComplete !== false; // default to true
            
            let html = '<h2>📊 ' + (isComplete ? 'Results' : 'Assessment in Progress...') + '</h2>';
            
            // Subject
            const subj = result.subject;
            html += '<div class="result-card" id="mainResultCard" onclick="toggleExpandCard(event)">';
            html += '<h3>🎯 ' + subj.name + '</h3>';
            html += '<div class="score">Score: ' + subj.score + ' / 7</div>';
            
            html += '<p><strong>Tier:</strong> ' + subj.tier.charAt(0).toUpperCase() + subj.tier.slice(1) + '</p>';
            
            if (subj.industry) {
                html += '<p><strong>Industry:</strong> ' + subj.industry + '</p>';
            }
            
            if (subj.business_model) {
                html += '<p><strong>Business Model:</strong> ' + subj.business_model + '</p>';
            }
            
            if (subj.cin) {
                html += '<p><strong>CIN:</strong> <span style="font-family:monospace;color:#667eea;background:#f0f0f0;padding:2px 6px;border-radius:4px;">' + subj.cin + '</span> <span style="background:#4caf50;color:white;padding:2px 6px;border-radius:10px;font-size:11px;">✓ Verified</span></p>';
            }
            
            if (subj.status) {
                const statusColor = subj.status.toLowerCase() === 'active' ? '#4caf50' : '#f44336';
                html += '<p><strong>Status:</strong> <span style="color:' + statusColor + ';font-weight:bold;">' + subj.status + '</span></p>';
            }
            
            if (subj.revenue_display) {
                // Show INR revenue from CIN
                html += '<p><strong>Revenue (INR):</strong> ' + subj.revenue_display;
                if (subj.financial_year) {
                    html += ' <span style="color:#888;font-size:13px;">(FY: ' + escapeHtml(subj.financial_year) + ')</span>';
                }
                if (subj.revenue_source) {
                    html += ' <small style="color:#999;">(' + subj.revenue_source + ')</small>';
                }
                html += '</p>';
            }
            
            if (subj.revenue_millions && subj.revenue_millions > 0) {
                const revenueFormatted = subj.revenue_millions >= 1000 
                    ? '$' + (subj.revenue_millions / 1000).toFixed(1) + 'B'
                    : '$' + subj.revenue_millions + 'M';
                html += '<p><strong>Revenue (USD):</strong> ' + revenueFormatted;
                if (!subj.revenue_display && subj.financial_year) {
                    html += ' <span style="color:#888;font-size:13px;">(FY: ' + escapeHtml(subj.financial_year) + ')</span>';
                }
                if (!subj.revenue_display && subj.revenue_source) {
                    html += ' <small style="color:#999;">(' + subj.revenue_source + ')</small>';
                }
                html += '</p>';
            }
            
            // Start 3-column grid layout for all company details
            html += '<div style="display:grid;grid-template-columns:repeat(3,1fr);gap:20px;margin-top:15px;">';
            
            // COLUMN 1: Directors
            html += '<div>';
            html += '<div style="margin-bottom:15px;"><strong>👥 Directors:</strong></div>';
            if (subj.directors && subj.directors.length > 0) {
                subj.directors.forEach(function(director, idx) {
                    html += '<div style="padding:5px 0;border-bottom:1px solid #eee;font-size:13px;">';
                    html += '<span style="font-weight:500;">' + escapeHtml(director.name) + '</span>';
                    
                    if (director.din) {
                        html += '<br><span style="color:#999;font-size:11px;">DIN: ' + director.din + '</span>';
                    }
                    
                    if (director.shareholding) {
                        html += '<br><span style="color:#667eea;font-size:12px;">📊 ' + director.shareholding + '%</span>';
                    }
                    
                    if (director.designation) {
                        html += '<br><span style="color:#888;font-size:11px;">' + escapeHtml(director.designation) + '</span>';
                    }
                    
                    html += '</div>';
                });
            } else {
                html += '<p style="color:#999;font-size:13px;font-style:italic;">Not available from public records</p>';
            }
            html += '</div>';
            
            // COLUMN 2: Financial & Company Details
            html += '<div>';
            
            // Capital Details
            html += '<div style="margin-bottom:15px;"><strong>💰 Capital:</strong></div>';
            if (subj.authorized_capital || subj.paid_up_capital) {
                if (subj.authorized_capital) {
                    const authCapital = subj.authorized_capital >= 10 
                        ? '₹' + (subj.authorized_capital / 10).toFixed(1) + ' Cr'
                        : '₹' + (subj.authorized_capital / 0.1).toFixed(0) + ' L';
                    html += '<p style="margin:3px 0;font-size:13px;"><strong>Authorized:</strong> ' + authCapital + '</p>';
                }
                
                if (subj.paid_up_capital) {
                    const paidCapital = subj.paid_up_capital >= 10 
                        ? '₹' + (subj.paid_up_capital / 10).toFixed(1) + ' Cr'
                        : '₹' + (subj.paid_up_capital / 0.1).toFixed(0) + ' L';
                    html += '<p style="margin:3px 0;font-size:13px;"><strong>Paid-Up:</strong> ' + paidCapital + '</p>';
                }
            } else {
                html += '<p style="color:#999;font-size:13px;font-style:italic;">Not available from public records</p>';
            }
            
            html += '<div style="margin:10px 0;"></div>';
            
            // Company Details
            html += '<div style="margin-bottom:15px;"><strong>📋 Details:</strong></div>';
            
            let hasDetails = false;
            
            if (subj.pan) {
                html += '<p style="margin:3px 0;font-size:13px;"><strong>PAN:</strong> <span style="font-family:monospace;color:#667eea;background:#f0f0f0;padding:1px 4px;border-radius:3px;font-size:12px;">' + escapeHtml(subj.pan) + '</span></p>';
                hasDetails = true;
            }
            
            if (subj.date_of_incorporation) {
                html += '<p style="margin:3px 0;font-size:13px;"><strong>Incorporated:</strong> ' + escapeHtml(subj.date_of_incorporation) + '</p>';
                hasDetails = true;
            }
            
            if (subj.company_class) {
                html += '<p style="margin:3px 0;font-size:13px;"><strong>Class:</strong> ' + escapeHtml(subj.company_class) + '</p>';
                hasDetails = true;
            }
            
            if (subj.roc) {
                html += '<p style="margin:3px 0;font-size:13px;"><strong>ROC:</strong> ' + escapeHtml(subj.roc) + '</p>';
                hasDetails = true;
            }
            
            if (!hasDetails) {
                html += '<p style="color:#999;font-size:13px;font-style:italic;">Not available from public records</p>';
            }
            
            html += '</div>';
            
            // COLUMN 3: Contact Information
            html += '<div>';
            html += '<div style="margin-bottom:15px;"><strong>📞 Contact:</strong></div>';
            
            let hasContact = false;
            
            if (subj.phone) {
                html += '<p style="margin:3px 0;font-size:13px;"><strong>📞 Phone:</strong><br>' + escapeHtml(subj.phone) + '</p>';
                hasContact = true;
            }
            
            if (subj.email) {
                html += '<p style="margin:3px 0;font-size:13px;"><strong>📧 Email:</strong><br><a href="mailto:' + escapeHtml(subj.email) + '" style="color:#667eea;word-break:break-all;">' + escapeHtml(subj.email) + '</a></p>';
                hasContact = true;
            }
            
            if (subj.address) {
                html += '<p style="margin:3px 0;font-size:13px;"><strong>📍 Address:</strong><br>' + escapeHtml(subj.address.substring(0, 120)) + (subj.address.length > 120 ? '...' : '') + '</p>';
                hasContact = true;
            }
            
            if (!hasContact) {
                html += '<p style="color:#999;font-size:13px;font-style:italic;">Not available from public records</p>';
            }
            
            html += '</div>';
            
            // End 3-column grid
            html += '</div>';
            
            html += '</div>';
            
            // Dimensions cards - show all 7, even if not all scored yet
            const allDimensions = ['content_marketing', 'seo_presence', 'social_engagement', 'conversion_signals', 'brand_authority', 'technical_optimization', 'thought_leadership'];
            
            html += '<h3>📋 Dimension Scores</h3>';
            html += '<div class="dimensions-grid">';
            
            allDimensions.forEach(function(key) {
                const score = subj.scoring_points ? subj.scoring_points[key] : null;
                const info = dimensionExplanations[key];
                const title = info ? info.title : key;
                
                if (score !== null && score !== undefined) {
                    // Scored dimension - full color
                    html += '<div class="dimension-card" onclick="showExplanation(\'' + key + '\')">';
                    html += '<div class="dimension-name">' + title + ' - ' + score + '/7</div>';
                    html += '</div>';
                } else {
                    // Not yet scored - grayed out
                    html += '<div class="dimension-card" style="opacity: 0.3; cursor: wait;">';
                    html += '<div class="dimension-name">' + title + ' - ⏳</div>';
                    html += '</div>';
                }
            });
            
            html += '</div>';
            
            // Explanation panel placeholder (content filled by showExplanation)
            html += '<div id="explanation-inline" class="explanation-panel"></div>';
            
            // Competitors
            if (result.competitors && result.competitors.length > 0) {
                html += '<h3>🏆 Competitors (' + result.competitors.length + '/10)</h3>';
                result.competitors.forEach(function(comp, idx) {
                    html += '<div class="result-card">';
                    html += '<strong>#' + (idx + 1) + ' ' + comp.name + '</strong> - ';
                    html += 'Score: ' + comp.score + ' / 7 ';
                    html += '(' + comp.tier + ')';
                    html += '</div>';
                });
            } else if (result.hasOwnProperty('competitors')) {
                // Explicitly show when no competitor data is available
                html += '<h3>🏆 Competitors</h3>';
                html += '<div class="result-card" style="background: #ffebcc; border-left: 4px solid #ff9800;">';
                html += '<strong>⚠️ No competitor data available</strong><br>';
                html += '<small>Unable to find competitor information from real sources. This may be due to:</small><br>';
                html += '<small>• Limited public information available</small><br>';
                html += '<small>• Company not found in public databases</small><br>';
                html += '<small>• Industry-specific data limitations</small>';
                html += '</div>';
            }
            
            document.getElementById('results').innerHTML = html;
        }
        
        function showExplanation(dimensionKey) {
            const info = dimensionExplanations[dimensionKey];
            if (!info) return;
            
            let html = '<div class="explanation-title">💡 ' + info.title + '</div>';
            html += '<p>' + info.description + '</p>';
            html += '<h4>Key Indicators:</h4>';
            html += '<ul>';
            info.indicators.forEach(function(indicator) {
                html += '<li>' + indicator + '</li>';
            });
            html += '</ul>';
            
            const panel = document.getElementById('explanation-inline');
            if (panel) {
                panel.innerHTML = html;
                panel.className = 'explanation-panel active';
                panel.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
            }
        }
        
        function displayResults(result) {
            displayPartialResults(result, true);
        }
        
        // Toggle expand/collapse result card
        function toggleExpandCard(event) {
            event.stopPropagation();
            const card = document.getElementById('mainResultCard');
            const overlay = document.getElementById('cardOverlay');
            
            if (!card) return;
            
            if (card.classList.contains('result-card-expanded')) {
                // Already expanded, do nothing (click outside will close)
                return;
            }
            
            // Expand the card
            card.classList.add('result-card-expanded');
            if (overlay) {
                overlay.classList.add('active');
            }
            
            // Prevent body scroll
            document.body.style.overflow = 'hidden';
        }
        
        function collapseCard() {
            const card = document.getElementById('mainResultCard');
            const overlay = document.getElementById('cardOverlay');
            
            if (card) {
                card.classList.remove('result-card-expanded');
            }
            if (overlay) {
                overlay.classList.remove('active');
            }
            
            // Restore body scroll
            document.body.style.overflow = '';
        }
        
        // Add Enter key support
        document.addEventListener('DOMContentLoaded', function() {
            document.getElementById('companyInput').addEventListener('keypress', function(e) {
                if (e.key === 'Enter') {
                    searchCompany();
                }
            });
            
            // Create overlay element
            const overlay = document.createElement('div');
            overlay.id = 'cardOverlay';
            overlay.className = 'card-overlay';
            overlay.onclick = collapseCard;
            document.body.appendChild(overlay);
        });
    </script>
</body>
</html>
